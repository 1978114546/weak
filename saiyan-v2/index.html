<html lang="zh-CN">

  <title>赛亚连珠 · 手机体验版</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}
    .app{--bg:#f3eee4;--bg2:#e7ddcd;--ink:#28211c;--muted:#81766a;--accent:#b8422b;--accent2:#8d2f22;--panel:rgba(255,252,246,.88);--border:rgba(105,78,46,.17);--board:#d6aa72;--board2:#bd8650;--grid:rgba(70,42,20,.72);--shadow:0 24px 70px rgba(72,45,22,.18);--soft:0 12px 36px rgba(72,45,22,.11);--radius:24px;min-height:100vh;position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 14% 0%,rgba(255,255,255,.72),transparent 36%),linear-gradient(135deg,var(--bg),var(--bg2));transition:.4s}
    .app[data-theme=neon]{--bg:#030914;--bg2:#07162b;--ink:#eef8ff;--muted:#7892ae;--accent:#10dfff;--accent2:#795cff;--panel:rgba(7,19,39,.86);--border:rgba(62,193,255,.28);--board:#142338;--board2:#091524;--grid:rgba(134,174,205,.45);--shadow:0 0 55px rgba(0,209,255,.15),0 30px 80px rgba(0,0,0,.48);--soft:0 16px 40px rgba(0,0,0,.32);background:radial-gradient(circle at 50% -10%,rgba(19,117,194,.26),transparent 38%),radial-gradient(circle at 95% 70%,rgba(95,54,217,.18),transparent 30%),linear-gradient(145deg,var(--bg),var(--bg2))}

    .orb{position:absolute;border-radius:50%;pointer-events:none;opacity:.55}.orb.a{width:420px;height:420px;top:-240px;right:-100px;border:1px solid var(--border);box-shadow:inset 0 0 80px var(--panel)}.orb.b{width:260px;height:260px;bottom:-180px;left:-90px;background:color-mix(in srgb,var(--accent) 9%,transparent)}

    .layout{width:min(1360px,calc(100% - 64px));margin:auto;padding:34px 0 42px;display:grid;grid-template-columns:minmax(520px,1fr) 330px;gap:clamp(28px,4vw,62px);align-items:center;position:relative;z-index:2}.board-col{min-width:0}.board-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}.board-title small{color:var(--accent);font-size:9px;letter-spacing:.18em;font-weight:800}.board-title h1{margin:4px 0 0;font-family:"Songti SC","STSong",serif;font-size:clamp(25px,2.2vw,34px);font-weight:600}.turn-count{border:1px solid var(--border);color:var(--muted);border-radius:999px;font-size:12px;padding:8px 13px;background:var(--panel)}.turn-count b{color:var(--accent);font-size:15px}
    .board-frame{width:min(100%,calc(100vh - 182px));aspect-ratio:1;padding:clamp(18px,2.5vw,30px);border-radius:calc(var(--radius) + 4px);background:linear-gradient(145deg,color-mix(in srgb,var(--board) 83%,white),var(--board2));box-shadow:var(--shadow),inset 0 0 0 1px color-mix(in srgb,var(--grid) 35%,transparent),inset 0 0 25px rgba(255,255,255,.18);transition:.4s}.app[data-theme=neon] .board-frame{border:1px solid rgba(29,222,255,.45);box-shadow:var(--shadow),inset 0 0 25px rgba(0,209,255,.08),0 0 0 4px rgba(0,90,150,.13)}.board{width:100%;height:100%;position:relative;border:1px solid var(--grid);background-image:linear-gradient(to right,transparent calc(100% - 1px),var(--grid) calc(100% - 1px)),linear-gradient(to bottom,transparent calc(100% - 1px),var(--grid) calc(100% - 1px));background-size:calc(100% / 14) calc(100% / 14)}.star{position:absolute;width:7px;height:7px;transform:translate(-50%,-50%);background:var(--grid);border-radius:50%;z-index:1}.cell{position:absolute;width:6.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;border-radius:50%;cursor:pointer;z-index:3}.cell:not(.used):not(:disabled):hover{background:color-mix(in srgb,var(--accent) 15%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.cell:disabled{opacity:1}.stone{position:absolute;inset:3%;border-radius:50%;opacity:1;animation:stone-in .18s cubic-bezier(.25,1.5,.5,1);box-shadow:0 2px 2px rgba(0,0,0,.2),0 7px 11px rgba(0,0,0,.38);overflow:hidden}.stone:before{content:"";position:absolute;left:17%;top:12%;width:44%;height:26%;border-radius:50%;transform:rotate(-24deg);background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.04));z-index:1}.stone:after{content:"";position:absolute;inset:2%;border-radius:50%;box-shadow:inset -4px -6px 8px rgba(0,0,0,.34),inset 3px 3px 5px rgba(255,255,255,.23)}.stone.black{background:radial-gradient(circle at 32% 25%,#777 0,#343434 17%,#151515 48%,#020202 84%);border:1px solid #050505}.stone.white{background:radial-gradient(circle at 32% 24%,#fff 0,#fffdf7 34%,#e5e1d8 66%,#aba9a4 100%);border:1px solid rgba(68,58,48,.32)}.app[data-theme=neon] .stone.black{box-shadow:0 0 0 1px rgba(0,230,255,.8),0 0 13px rgba(0,223,255,.68),0 7px 12px #000}.app[data-theme=neon] .stone.white{box-shadow:0 0 0 1px rgba(164,120,255,.9),0 0 15px rgba(138,91,255,.72),0 7px 12px #000}.stone .last{position:absolute;width:22%;height:22%;border-radius:50%;background:var(--accent);top:39%;left:39%;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 23%,transparent);z-index:2}.stone.winner{box-shadow:0 0 0 4px var(--accent),0 0 22px var(--accent);animation:winner 1s infinite alternate}
    aside{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--soft);backdrop-filter:blur(18px)}.status-card{min-height:78px;display:flex;align-items:center;gap:15px;padding:15px 17px;border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--panel) 84%,var(--accent) 4%)}.mini-stone{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 22%,#858585,#242424 30%,#030303 78%);box-shadow:inset 3px 3px 4px rgba(255,255,255,.2),inset -4px -5px 7px #000,0 5px 10px rgba(0,0,0,.35)}.status-card small{color:var(--muted);font-size:8px;letter-spacing:.18em;display:block;margin-bottom:4px}.status-card strong{font-size:18px}aside section{margin-top:22px}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}.section-title b{font-size:14px}.section-title small{color:var(--muted);font-size:10px}.levels{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}.levels button{padding:10px 4px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}.levels button.active{background:var(--accent);color:white;box-shadow:0 5px 13px color-mix(in srgb,var(--accent) 28%,transparent)}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-btn{border:1px solid var(--border);border-radius:13px;padding:7px 5px 9px;background:transparent;color:var(--ink);cursor:pointer}.theme-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}.theme-btn>b,.theme-btn>small{display:block;white-space:nowrap}.theme-btn>b{font-size:10px;margin-top:6px}.theme-btn>small{color:var(--muted);font-size:8px;margin-top:2px}.preview{display:block;height:45px;position:relative;border-radius:7px;overflow:hidden;background-size:9px 9px}.preview.zen{background-color:#d6aa72;background-image:linear-gradient(#76502d 1px,transparent 1px),linear-gradient(90deg,#76502d 1px,transparent 1px)}.preview.neon{background-color:#122238;background-image:linear-gradient(#4d6c86 1px,transparent 1px),linear-gradient(90deg,#4d6c86 1px,transparent 1px)}.preview.breeze{background-color:#ead5a4;background-image:linear-gradient(#aa8452 1px,transparent 1px),linear-gradient(90deg,#aa8452 1px,transparent 1px)}.preview i{position:absolute;width:11px;height:11px;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.25)}.preview i:nth-child(1){background:#111;top:8px;left:20%}.preview i:nth-child(2){background:#f6f3ed;top:18px;left:45%}.preview i:nth-child(3){background:#111;top:28px;left:67%}.actions{display:grid;grid-template-columns:.8fr 1.2fr;gap:9px;padding-top:20px;margin-top:20px;border-top:1px solid var(--border)}.actions button,.mobile-actions button{border-radius:12px;padding:12px 8px;font-weight:700;cursor:pointer}.actions button:first-child{color:var(--accent);background:transparent;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent)}.actions button:last-child{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}.actions button:disabled,.mobile-actions button:disabled{opacity:.42;cursor:not-allowed}.record{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;margin-top:14px;background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:12px;padding:10px;text-align:center}.record div{display:flex;align-items:baseline;justify-content:center;gap:5px}.record small{color:var(--muted);font-size:10px}.record b{font-size:18px}.record>i{width:1px;height:20px;background:var(--border)}.save{color:var(--accent);text-align:center;font-size:9px;margin:12px 0 0}.mobile-actions{display:none}
    .modal-layer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,8,12,.56);backdrop-filter:blur(8px);padding:20px}.modal{width:min(430px,100%);text-align:center;background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:var(--radius);padding:38px 34px 30px;box-shadow:var(--shadow)}.modal>small{color:var(--accent);font-size:10px;letter-spacing:.25em;font-weight:800}.modal h2{font-family:"Songti SC","STSong",serif;margin:10px 0 8px;font-size:34px}.modal p{color:var(--muted);font-size:13px;line-height:1.8;margin:0 auto 23px}.modal div{display:flex;gap:10px;justify-content:center}.modal button{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:11px;padding:11px 24px;cursor:pointer}.modal button:last-child{background:transparent;color:var(--ink);border-color:var(--border)}.hidden{display:none!important}
    @keyframes stone-in{from{transform:scale(.2);opacity:0}}@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent)}}@keyframes winner{to{transform:scale(1.05)}}
    @media(max-width:980px){header{padding:0 22px}.top-status{display:none}.layout{width:min(720px,calc(100% - 32px));grid-template-columns:1fr;gap:20px;padding-top:24px}.board-frame{width:100%}aside{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;align-items:start}aside section,.record{margin-top:0}.status-card,.record{grid-column:1/-1}.actions{display:none}.save{display:none}.mobile-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:14px}.mobile-actions button{color:var(--ink);background:var(--panel);border:1px solid var(--border)}.mobile-actions button:last-child{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}}
    @media(max-width:560px){header{height:68px}.brand strong{font-size:20px}.new-game b{display:none}.layout{width:calc(100% - 20px);padding:18px 0 24px}.board-title{margin:0 3px 12px}.board-title h1{font-size:23px}.turn-count{font-size:10px;padding:7px 10px}.board-frame{padding:13px;border-radius:17px}.cell{width:7.7%}aside{grid-template-columns:1fr;gap:20px;padding:17px}.status-card,.record{grid-column:auto}.preview{height:54px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  
/* Saiyan mobile enhancement */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
@media(max-width:600px){.app{min-height:100dvh}.cell{touch-action:manipulation}}

<body>
  <main class="app" id="app" data-theme="zen">
    <div class="orb a"></div><div class="orb b"></div>
    <header>
      <div class="brand"><span class="logo"><i></i><i></i></span><div><strong>连珠</strong><small>GOMOKU</small></div></div>
      <div class="top-status"><i></i> 人机对弈 · 黑棋先行</div>
      <button class="new-game" data-action="restart">↻ <b>新对局</b></button>
    </header>
    <section class="layout">
      <div class="board-col">
        <div class="board-title"><div><small>当前对局</small><h1 id="status">轮到你 · 黑棋</h1></div><span class="turn-count">第 <b id="turn">1</b> 回合</span></div>
        <div class="board-frame"><div class="board" id="board" role="grid" aria-label="十五乘十五五子棋棋盘"></div></div>
        <div class="mobile-actions"><button data-action="undo">↶ 悔棋</button><button data-action="restart">↻ 重新开始</button></div>
      </div>
      <aside>
        <div class="status-card"><span class="mini-stone"></span><div><small>GAME STATUS</small><strong id="side-status">轮到你 · 黑棋</strong></div></div>
        <section><div class="section-title"><b>AI 难度</b><small>切换后开启新局</small></div><div class="levels"><button data-level="easy">入门</button><button data-level="normal">进阶</button><button data-level="hard">大师</button></div></section>
        <section><div class="section-title"><b>视觉主题</b><small>随时切换</small></div><div class="themes">
          <button class="theme-btn" data-theme="zen"><span class="preview zen"><i></i><i></i><i></i></span><b>东方木纹</b><small>雅致</small></button>
          <button class="theme-btn" data-theme="neon"><span class="preview neon"><i></i><i></i><i></i></span><b>霓虹电竞</b><small>竞技</small></button>
          <button class="theme-btn" data-theme="breeze"><span class="preview breeze"><i></i><i></i><i></i></span><b>清风棋局</b><small>轻松</small></button>
        </div></section>
        <div class="actions"><button data-action="undo">↶ 悔棋</button><button data-action="restart">↻ 重新开始</button></div>
        <div class="record"><div><small>胜</small><b id="wins">0</b></div><i></i><div><small>负</small><b id="losses">0</b></div><i></i><div><small>和</small><b id="draws">0</b></div></div>
        <p class="save">✓ 本机存档已开启</p>
      </aside>
    </section>
    <div class="modal-layer hidden" id="modal"><div class="modal"><small>本局结束</small><h2 id="modal-title"></h2><p id="modal-text"></p><div><button data-action="restart">再来一局</button><button data-action="close">查看棋盘</button></div></div></div>
  </main>
  <script>
    (()=>{
      const N=15,dirs=[[1,0],[0,1],[1,1],[1,-1]],key="gomoku-static-save-v1";
      const app=document.getElementById("app"),boardEl=document.getElementById("board"),modal=document.getElementById("modal");
      let state={board:Array(N*N).fill(0),history:[],level:"normal",theme:"zen",result:null,win:[],record:{wins:0,losses:0,draws:0},thinking:false};
      const at=(r,c)=>r*N+c,inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
      const safeSave=s=>s&&Array.isArray(s.board)&&s.board.length===225&&Array.isArray(s.history)&&["easy","normal","hard"].includes(s.level)&&["zen","neon","breeze"].includes(s.theme)&&s.record;
      try{const saved=JSON.parse(localStorage.getItem(key));if(safeSave(saved)){state={...state,...saved,thinking:false};if(state.history.length%2){state.history.pop();state.board=Array(N*N).fill(0);state.history.forEach((m,i)=>state.board[m]=i%2?2:1)}}}catch{}
      function save(){const clean={...state,thinking:false};localStorage.setItem(key,JSON.stringify(clean))}
      function lineFor(board,move,who){const row=Math.floor(move/N),col=move%N;for(const[dr,dc]of dirs){const line=[move];for(const sign of[-1,1]){let r=row+dr*sign,c=col+dc*sign;while(inside(r,c)&&board[at(r,c)]===who){sign<0?line.unshift(at(r,c)):line.push(at(r,c));r+=dr*sign;c+=dc*sign}}if(line.length>=5)return line}return[]}
      function nearby(board){if(!board.some(Boolean))return[at(7,7)];const moves=new Set;board.forEach((stone,i)=>{if(!stone)return;const row=Math.floor(i/N),col=i%N;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const r=row+dr,c=col+dc;if(inside(r,c)&&!board[at(r,c)])moves.add(at(r,c))}});return[...moves]}
      function score(board,move,who){const row=Math.floor(move/N),col=move%N;board[move]=who;let total=0;for(const[dr,dc]of dirs){let count=1,open=0;for(const sign of[-1,1]){let r=row+dr*sign,c=col+dc*sign;while(inside(r,c)&&board[at(r,c)]===who){count++;r+=dr*sign;c+=dc*sign}if(inside(r,c)&&!board[at(r,c)])open++}if(count>=5)total+=1e6;else if(count===4&&open===2)total+=8e4;else if(count===4)total+=16e3;else if(count===3&&open===2)total+=7e3;else if(count===3)total+=900;else if(count===2&&open===2)total+=320;else total+=count*20+open*5}board[move]=0;return total+(14-Math.abs(row-7)-Math.abs(col-7))*2}
      function chooseAi(board){const moves=nearby(board);if(!moves.length)return-1;if(state.level==="easy")return moves[Math.floor(Math.random()*moves.length)];const ranked=moves.map(move=>{const attack=score(board,move,2),block=score(board,move,1);return{move,value:Math.max(attack,block*(state.level==="hard"?1.12:.92))+attack*.2+Math.random()*(state.level==="hard"?5:100)}}).sort((a,b)=>b.value-a.value);return state.level==="normal"&&ranked.length>1&&Math.random()<.16?ranked[1].move:ranked[0].move}
      function status(){return state.result===1?"你赢了！":state.result===2?"AI 获胜":state.result===3?"棋逢对手 · 和棋":state.thinking?"AI 正在思考…":"轮到你 · 黑棋"}
      function render(){app.dataset.theme=state.theme;document.querySelector('meta[name="theme-color"]').content=getComputedStyle(app).getPropertyValue("--bg").trim();document.getElementById("status").textContent=status();document.getElementById("side-status").textContent=status();document.getElementById("turn").textContent=Math.floor(state.history.length/2)+1;document.getElementById("wins").textContent=state.record.wins;document.getElementById("losses").textContent=state.record.losses;document.getElementById("draws").textContent=state.record.draws;document.querySelectorAll("[data-level]").forEach(b=>b.classList.toggle("active",b.dataset.level===state.level));document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("active",b.dataset.theme===state.theme));document.querySelectorAll('[data-action="undo"]').forEach(b=>b.disabled=!state.history.length||state.thinking);boardEl.querySelectorAll(".cell").forEach((cell,i)=>{const stone=state.board[i];cell.classList.toggle("used",!!stone);cell.disabled=!!stone||state.thinking||!!state.result;cell.innerHTML=stone?`<span class="stone ${stone===1?"black":"white"} ${state.win.includes(i)?"winner":""}">${state.history.at(-1)===i?'<i class="last"></i>':""}</span>`:""});save()}
      function finish(result,line){state.result=result;state.win=line;state.thinking=false;if(result===1)state.record.wins++;if(result===2)state.record.losses++;if(result===3)state.record.draws++;const title=result===1?"漂亮的五连！":result===2?"棋差一着":"势均力敌",text=result===1?"你击败了 AI，继续挑战更高难度吧。":result===2?"AI 抢先连成五子，再来一局扳回来。":"棋盘已满，这是一场精彩的和棋。";document.getElementById("modal-title").textContent=title;document.getElementById("modal-text").textContent=text;modal.classList.remove("hidden");render()}
      function restart(){state.board=Array(N*N).fill(0);state.history=[];state.result=null;state.win=[];state.thinking=false;modal.classList.add("hidden");render()}
      function undo(){if(state.thinking||!state.history.length)return;const count=state.history.length%2?1:2;state.history.splice(-count);state.board=Array(N*N).fill(0);state.history.forEach((m,i)=>state.board[m]=i%2?2:1);state.result=null;state.win=[];modal.classList.add("hidden");render()}
      function play(move){if(state.thinking||state.result||state.history.length%2||state.board[move])return;state.board[move]=1;state.history.push(move);let line=lineFor(state.board,move,1);if(line.length)return finish(1,line);if(state.history.length===225)return finish(3,[]);state.thinking=true;render();setTimeout(()=>{const ai=chooseAi([...state.board]);if(ai<0)return finish(3,[]);state.board[ai]=2;state.history.push(ai);line=lineFor(state.board,ai,2);if(line.length)return finish(2,line);if(state.history.length===225)return finish(3,[]);state.thinking=false;render()},state.level==="hard"?500:350)}
      [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]].forEach(([r,c])=>{const star=document.createElement("i");star.className="star";star.style.cssText=`top:${r/14*100}%;left:${c/14*100}%`;boardEl.appendChild(star)});
      for(let i=0;i<225;i++){const r=Math.floor(i/N),c=i%N,cell=document.createElement("button");cell.className="cell";cell.style.cssText=`top:${r/14*100}%;left:${c/14*100}%`;cell.setAttribute("role","gridcell");cell.setAttribute("aria-label",`${r+1}行${c+1}列`);cell.addEventListener("click",()=>play(i));boardEl.appendChild(cell)}
      document.addEventListener("click",e=>{const target=e.target.closest("button");if(!target)return;if(target.dataset.action==="restart")restart();if(target.dataset.action==="undo")undo();if(target.dataset.action==="close")modal.classList.add("hidden");if(target.dataset.level){state.level=target.dataset.level;restart()}if(target.classList.contains("theme-btn")){state.theme=target.dataset.theme;render()}});
      render();
      console.info('Saiyan Gomoku mobile build loaded');
    })();
  </script>
</body>
